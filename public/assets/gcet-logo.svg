<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="GCET Institutional Crest Logo">
  <defs>
    <linearGradient id="gcetNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101A35" />
      <stop offset="100%" stop-color="#1E3A6E" />
    </linearGradient>
    <linearGradient id="gcetGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Outer Crest Ring -->
  <circle cx="60" cy="60" r="57" fill="#FFFFFF" stroke="#101A35" stroke-width="3" />
  <circle cx="60" cy="60" r="51" fill="url(#gcetNavy)" stroke="url(#gcetGold)" stroke-width="2" />
  <circle cx="60" cy="60" r="39" fill="none" stroke="#20C5E8" stroke-width="1" stroke-opacity="0.55" />

  <!-- Engineering Gear Accent -->
  <g fill="none" stroke="#20C5E8" stroke-width="2.2" stroke-linecap="round">
    <circle cx="60" cy="48" r="14" stroke-opacity="0.9" />
    <path d="M60 30v4M60 62v4M42 48h4M74 48h4M47.3 35.3l2.8 2.8M69.9 57.9l2.8 2.8M72.7 35.3l-2.8 2.8M50.1 57.9l-2.8 2.8" />
  </g>

  <!-- Open Book & Torch of Knowledge -->
  <path d="M44 54c5-2.5 11-2 16 1 5-3 11-3.5 16-1v13c-5-2.2-11-1.6-16 1.4-5-3-11-3.6-16-1.4V54z" fill="#FFFFFF" fill-opacity="0.95" />
  <path d="M60 55v13.5" stroke="#101A35" stroke-width="1.6" />
  <path d="M60 39c2.4 2.8 3.2 5.4 1.6 7.8-.8 1.2-2.4 1.2-3.2 0-1.6-2.4-.8-5 1.6-7.8z" fill="#F59E0B" />

  <!-- Institutional Monogram -->
  <text x="60" y="88" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">GCET</text>
  <text x="60" y="99" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="6.2" font-weight="600" letter-spacing="1" fill="#20C5E8">HYDERABAD</text>
</svg>
